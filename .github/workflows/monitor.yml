on:
  schedule:
    # BRT = UTC-3 → 00h,06h,12h,18h BRT = 03,09,15,21 UTC
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch: {}   # permite rodar manualmente (teste/auditoria)

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Rodar coleta
        run: python scraper.py

      - name: Commit do snapshot
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/precos.json
          git commit -m "coleta $(date -u +'%Y-%m-%dT%H:%M')" || echo "nada a commitar"
          git push

      - name: Purge do cache jsdelivr (dado fresco no dashboard)
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/data/precos.json" || true
